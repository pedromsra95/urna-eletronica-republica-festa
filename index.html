    <script>
        // --- SCRIPT NO HEAD: REGISTRO IMEDIATO NO WINDOW ---
        window.SENHA_MESTRE = "RESULTADO_VOTACAO";
        window.STORAGE_KEY = 'urna_resenha_ministerios_v5';

        window.ministerios = [
            {
                id: 'alegria',
                nome: 'Ministro(a) da Alegria e do Entretenimento',
                candidatos: [
                    { id: '3204', nome: 'Silvia Camila' },

                ]
            },

                ]
            },
            {
                id: 'comunicacao',
                nome: 'Ministro(a) das Comunicações e Relações Exteriores',
                candidatos: [
                    { id: '3213', nome: 'Luiz Terra' },
                    { id: '3209', nome: 'Izadora Azevedo' },
                    { id: '3211', nome: 'Jederson Pontes' }
                ]
            },
            {
                id: 'saude',
                nome: 'Ministro(a) da Saúde e Sobrevivência',
                candidatos: [
                    { id: '3204', nome: 'Silvia Camila' },
                    { id: '3218', nome: 'Raíssa Cunha' },
                    { id: '3208', nome: 'Geórgia Barbosa' }
                ]
            },
            {
                id: 'nordestina',
                nome: 'Ministro(a) da Cultura Nordestina',
                candidatos: [
                    { id: '3210', nome: 'Janine Maribondo' },
                    { id: '3219', nome: 'Ubaldo Merçon' },
                    { id: '3222', nome: 'Eri Silva' }
                ]
            },
            {
                id: 'minusculas',
                nome: 'Ministro(a) das Minúsculas Causas',
                candidatos: [
                    { id: '3203', nome: 'Artur Avelino' },
                    { id: '3213', nome: 'Luiz Terra' },
                    { id: '3216', nome: 'Pedro de Araújo' },
                    { id: '3214', nome: 'Dannilo Rodrigues' }
                ]
            },
            {
                id: 'juventude',
                nome: 'Ministro(a) da Juventude',
                candidatos: [
                    { id: '3220', nome: 'Ana Clarisse' },
                    { id: '3205', nome: 'Dália Margarida' },
                    { id: '3212', nome: 'Maria Letícia' }
                ]
            },
            {
                id: 'fantasma',
                nome: 'Ministro(a) Fantasma',
                candidatos: [
                    { id: '3201', nome: 'Adriana Rodrigues' },
                    { id: '3221', nome: 'Maria Júlia' },
                    { id: '3222', nome: 'Eri Silva' },
                    { id: '3223', nome: 'Andresa Moura' }
                ]
            },
            {
                id: 'performance',
                nome: 'Ministério da Performance',
                candidatos: [
                    { id: '3216', nome: 'Pedro de Araújo' },
                    { id: '3224', nome: 'Dante Miranda' },
                    { id: '3219', nome: 'Ubaldo Merçon' },
                    { id: '3213', nome: 'Luiz Terra' }
                ]
            }
        ];

        window.etapaAtual = 0;
        window.numeroDigitado = '';
        window.eBranco = false;

        window.carregarVotos = function() {
            try {
                var salvos = JSON.parse(localStorage.getItem(window.STORAGE_KEY));
                if (salvos && typeof salvos === 'object') return salvos;
            } catch(e) {}
            
            var novo = {};
            window.ministerios.forEach(function(m) {
                novo[m.id] = { 'BRANCO': 0, 'NULO': 0 };
                m.candidatos.forEach(function(c) { novo[m.id][c.id] = 0; });
            });
            return novo;
        };

        window.votos = window.carregarVotos();

        window.atualizarTela = function() {
            var minAtual = window.ministerios[window.etapaAtual];
            document.getElementById('etapa-indicador').innerText = 'SEU VOTO VAI PARA (' + (window.etapaAtual + 1) + '/' + window.ministerios.length + ')';
            document.getElementById('cargo-nome').innerText = minAtual.nome;

            var digitosDiv = document.getElementById('digitos');
            var infoDiv = document.getElementById('info-candidato');
            digitosDiv.innerHTML = '';
            infoDiv.innerHTML = '';

            if (window.eBranco) {
                infoDiv.innerHTML = '<h3 style="font-size:1.3rem; text-align:center; margin-top:15px; color:#0284c7;">VOTO EM BRANCO</h3>';
                return;
            }

            for (var i = 0; i < 4; i++) {
                var box = document.createElement('div');
                box.className = 'digito-box';
                if (window.numeroDigitado[i]) {
                    box.innerText = window.numeroDigitado[i];
                } else if (i === window.numeroDigitado.length) {
                    box.classList.add('pisca');
                }
                digitosDiv.appendChild(box);
            }

            if (window.numeroDigitado.length === 4) {
                var candidato = minAtual.candidatos.find(function(c) { return c.id === window.numeroDigitado; });
                if (candidato) {
                    infoDiv.innerHTML = '<p><strong>Nome:</strong> ' + candidato.nome + '</p><p><strong>Número:</strong> ' + candidato.id + '</p>';
                } else {
                    infoDiv.innerHTML = '<p style="color:red; font-weight:bold;">VOTO NULO</p><p style="font-size:0.8rem; color:#64748b;">Candidato não concorrente a este ministério</p>';
                }
            }
        };

        window.digitar = function(n) {
            if (window.eBranco || window.numeroDigitado.length >= 4) return;
            window.numeroDigitado += n;
            window.atualizarTela();
        };

        window.votarBranco = function() {
            if (window.numeroDigitado === '') {
                window.eBranco = true;
                window.atualizarTela();
            }
        };

        window.corrige = function() {
            window.numeroDigitado = '';
            window.eBranco = false;
            window.atualizarTela();
        };

        window.confirma = function() {
            var minAtual = window.ministerios[window.etapaAtual];

            if (window.eBranco) {
                window.votos[minAtual.id]['BRANCO'] = (window.votos[minAtual.id]['BRANCO'] || 0) + 1;
                window.proximaEtapa();
            } else if (window.numeroDigitado.length === 4) {
                var candidato = minAtual.candidatos.find(function(c) { return c.id === window.numeroDigitado; });
                if (candidato) {
                    window.votos[minAtual.id][candidato.id] = (window.votos[minAtual.id][candidato.id] || 0) + 1;
                } else {
                    window.votos[minAtual.id]['NULO'] = (window.votos[minAtual.id]['NULO'] || 0) + 1;
                }
                window.proximaEtapa();
            }
        };

        window.proximaEtapa = function() {
            localStorage.setItem(window.STORAGE_KEY, JSON.stringify(window.votos));
            window.numeroDigitado = '';
            window.eBranco = false;

            if (window.etapaAtual + 1 < window.ministerios.length) {
                window.etapaAtual++;
                window.atualizarTela();
            } else {
                var fimOverlay = document.getElementById('tela-fim');
                fimOverlay.style.display = 'flex';

                setTimeout(function() {
                    fimOverlay.style.display = 'none';
                    window.etapaAtual = 0;
                    window.atualizarTela();
                    window.renderizarPlacar();
                }, 2000);
            }
        };

        window.validarSenha = function() {
            var senhaDigitada = document.getElementById('input-senha').value;
            var erroMsg = document.getElementById('msg-erro');
            
            if (senhaDigitada === window.SENHA_MESTRE) {
                document.getElementById('area-bloqueada').style.display = 'none';
                document.getElementById('conteudo-placar').style.display = 'block';
                document.getElementById('input-senha').value = '';
                erroMsg.style.display = 'none';
                window.renderizarPlacar();
            } else {
                erroMsg.style.display = 'block';
            }
        };

        window.checarEnter = function(event) {
            if (event.key === 'Enter') window.validarSenha();
        };

        window.ocultarPlacar = function() {
            document.getElementById('area-bloqueada').style.display = 'flex';
            document.getElementById('conteudo-placar').style.display = 'none';
        };

        window.renderizarPlacar = function() {
            var container = document.getElementById('lista-resultados-cargos');
            if (!container) return;
            container.innerHTML = '';

            window.ministerios.forEach(function(m) {
                var bloco = document.createElement('div');
                bloco.className = 'cargo-bloco-resultado';
                
                var html = '<h4>' + m.nome + '</h4>';
                html += '<table class="tabela-resultados"><thead><tr><th>Nº</th><th>Candidato</th><th>Votos</th></tr></thead><tbody>';

                var placarCargo = m.candidatos.map(function(c) {
                    return {
                        id: c.id,
                        nome: c.nome,
                        qtd: (window.votos[m.id] && window.votos[m.id][c.id]) ? window.votos[m.id][c.id] : 0
                    };
                }).sort(function(a, b) { return b.qtd - a.qtd; });

                placarCargo.forEach(function(item) {
                    html += '<tr><td><strong>' + item.id + '</strong></td><td>' + item.nome + '</td><td><strong>' + item.qtd + '</strong></td></tr>';
                });

                var brancos = (window.votos[m.
