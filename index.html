<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica - Resenha 🗳️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body {
            background-color: #1e293b;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* Estrutura principal da Urna */
        .urna-container {
            background-color: #d1d5db;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            border: 3px solid #9ca3af;
        }

        @media (max-width: 768px) {
            .urna-container { grid-template-columns: 1fr; }
        }

        /* Tela da Urna */
        .tela {
            background-color: #f8fafc;
            border: 4px solid #475569;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 340px;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .tela-header { font-size: 0.85rem; font-weight: bold; color: #475569; text-transform: uppercase; margin-bottom: 10px; }
        .cargo-titulo { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; }
        
        .digitos-container { display: flex; gap: 8px; margin: 15px 0; }
        .digito-box {
            width: 35px;
            height: 45px;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            background: white;
        }
        .digito-box.pisca { animation: pisca 1s infinite; }

        @keyframes pisca { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .candidato-info { margin-top: 10px; font-size: 1rem; line-height: 1.4; }
        .candidato-info p { margin-bottom: 4px; }
        
        .instrucoes {
            border-top: 2px solid #cbd5e1;
            padding-top: 10px;
            font-size: 0.75rem;
            color: #64748b;
        }

        .tela-fim {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 4rem;
            font-weight: 900;
            color: #000;
            letter-spacing: 5px;
        }

        /* Teclado da Urna */
        .teclado {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
        }

        .teclado-linha { display: flex; gap: 12px; }

        .btn-num {
            background-color: #0f172a;
            color: white;
            border: none;
            width: 55px;
            height: 45px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px #000;
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .btn-num:active { transform: translateY(3px); box-shadow: 0 1px #000; }

        .teclado-acoes { display: flex; gap: 10px; margin-top: 10px; width: 100%; justify-content: center; }

        .btn-acao {
            border: none;
            padding: 12px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 3px rgba(0,0,0,0.3);
            flex: 1;
            max-width: 90px;
        }
        .btn-acao:active { transform: translateY(2px); box-shadow: none; }
        .btn-branco { background-color: #ffffff; color: #000; }
        .btn-corrige { background-color: #f97316; color: #fff; }
        .btn-confirma { background-color: #22c55e; color: #fff; font-size: 0.85rem; padding: 16px 10px; }

        /* Painel Lateral / Placar */
        .painel-apuração {
            grid-column: span 2;
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 10px;
        }

        @media (max-width: 768px) { .painel-apuração { grid-column: span 1; } }

        .tabela-resultados { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        .tabela-resultados th, .tabela-resultados td { border-bottom: 1px solid #e2e8f0; padding: 8px; text-align: left; }
        .tabela-resultados th { background: #f1f5f9; }
        .btn-zerar { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 15px; float: right; }
    </style>
</head>
<body>

    <div class="urna-container">
        <!-- TELA -->
        <div class="tela" id="tela">
            <div>
                <div class="tela-header">SEU VOTO VAI PARA</div>
                <div class="cargo-titulo">CANDIDATO(A)</div>
                <div class="digitos-container" id="digitos">
                    <div class="digito-box pisca"></div>
                    <div class="digito-box"></div>
                    <div class="digito-box"></div>
                    <div class="digito-box"></div>
                </div>
                <div class="candidato-info" id="info-candidato">
                    <!-- Informações do candidato via JS -->
                </div>
            </div>
            <div class="instrucoes">
                Aperte a tecla:<br>
                <strong>CONFIRMA</strong> para CONFIRMAR este voto<br>
                <strong>CORRIGE</strong> para REINICIAR este voto
            </div>
        </div>

        <!-- TECLADO -->
        <div class="teclado">
            <div class="teclado-linha">
                <button class="btn-num" onclick="digitar('1')">1</button>
                <button class="btn-num" onclick="digitar('2')">2</button>
                <button class="btn-num" onclick="digitar('3')">3</button>
            </div>
            <div class="teclado-linha">
                <button class="btn-num" onclick="digitar('4')">4</button>
                <button class="btn-num" onclick="digitar('5')">5</button>
                <button class="btn-num" onclick="digitar('6')">6</button>
            </div>
            <div class="teclado-linha">
                <button class="btn-num" onclick="digitar('7')">7</button>
                <button class="btn-num" onclick="digitar('8')">8</button>
                <button class="btn-num" onclick="digitar('9')">9</button>
            </div>
            <div class="teclado-linha">
                <button class="btn-num" onclick="digitar('0')">0</button>
            </div>
            <div class="teclado-acoes">
                <button class="btn-acao btn-branco" onclick="votarBranco()">Branco</button>
                <button class="btn-acao btn-corrige" onclick="corrige()">Corrige</button>
                <button class="btn-acao btn-confirma" onclick="confirma()">Confirma</button>
            </div>
        </div>

        <!-- APURAÇÃO / RESULTADOS -->
        <div class="painel-apuração">
            <h3>📊 Parcial da Apuração</h3>
            <table class="tabela-resultados">
