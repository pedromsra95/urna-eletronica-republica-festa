<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica - Eleição dos Ministérios 🗳️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body {
            background-color: #1e293b;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .urna-container {
            background-color: #d1d5db;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            border: 3px solid #9ca3af;
        }

        @media (max-width: 768px) {
            .urna-container { grid-template-columns: 1fr; }
        }

        .tela {
            background-color: #f8fafc;
            border: 4px solid #475569;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 360px;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .tela-header { font-size: 0.8rem; font-weight: bold; color: #475569; text-transform: uppercase; }
        .cargo-titulo { font-size: 1.1rem; font-weight: bold; margin: 8px 0 12px 0; color: #0f172a; min-height: 2.4em; }
        
        .digitos-container { display: flex; gap: 8px; margin: 10px 0; }
        .digito-box {
            width: 35px;
            height: 45px;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            background: white;
        }
        .digito-box.pisca { animation: pisca 1s infinite; }

        @keyframes pisca { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .candidato-info { margin-top: 5px; font-size: 0.95rem; line-height: 1.3; min-height: 60px; }
        
        .instrucoes {
            border-top: 2px solid #cbd5e1;
            padding-top: 8px;
            font-size: 0.72rem;
            color: #64748b;
        }

        .tela-inicio-fim {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 15px;
        }
        
        .tela-inicio-fim h2 { font-size: 1.8rem; color: #0f172a; }
        .tela-inicio-fim p { font-size: 0.9rem; color: #475569; }

        .btn-iniciar {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px rgba(0,0,0,0.2);
        }
        .btn-iniciar:active { transform: translateY(2px); box-shadow: none; }

        .resumo-container {
            max-height: 250px;
            overflow-y: auto;
            font-size: 0.85rem;
            text-align: left;
            width: 100%;
            background: #fff;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }
        .resumo-item { margin-bottom: 8px; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; }

        .teclado {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
        }

        .teclado-linha { display: flex; gap: 12px; }

        .btn-num {
            background-color: #0f172a;
            color: white;
            border: none;
            width: 55px;
            height: 45px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px #000;
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .btn-num:active { transform: translateY(3px); box-shadow: 0 1px #000; }

        .teclado-acoes { display: flex; gap: 10px; margin-top: 10px; width: 100%; justify-content: center; }

        .btn-acao {
            border: none;
            padding: 12px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 3px rgba(0,0,0,0.3);
            flex: 1;
            max-width: 90px;
        }
        .btn-acao:active { transform: translateY(2px); box-shadow: none; }
        .btn-branco { background-color: #ffffff; color: #000; }
        .btn-corrige { background-color: #f97316; color: #fff; }
        .btn-confirma { background-color: #22c55e; color: #fff; font-size: 0.85rem; padding: 16px 10px; }

        .painel-apuração {
            grid-column: span 2;
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 10px;
        }

        @media (max-width: 768px) { .painel-apuração { grid-column: span 1; } }

        .cargo-bloco-resultado { margin-bottom: 20px; }
        .cargo-bloco-resultado h4 { background: #f1f5f9; padding: 6px 10px; border-radius: 4px; border-left: 4px solid #3b82f6; font-size: 0.95rem; }

        .tabela-resultados { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 0.85rem; }
        .tabela-resultados th, .tabela-resultados td { border-bottom: 1px solid #e2e8f0; padding: 6px 8px; text-align: left; }
        
        .painel-acoes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .btn-zerar { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .btn-ocultar { background: #64748b; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }

        .bloqueio-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            max-width: 320px;
        }

        .senha-input {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        .senha-input:focus { border-color: #3b82f6; }

        .btn-desbloquear {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-desbloquear:hover { background-color: #2563eb; }

        .erro-senha { color: #ef4444; font-size: 0.85rem; display: none; }
    </style>
</head>
<body>

    <div class="urna-container">
        <!-- TELA -->
        <div class="tela" id="tela">
            <div id="tela-conteudo">
                <div class="tela-header" id="etapa-indicador">SEU VOTO VAI PARA (1/9)</div>
                <div class="cargo-titulo" id="cargo-nome">CARGO</div>
                <div class="digitos-container" id="digitos">
                    <div class="digito-box pisca"></div>
                    <div class="digito-box"></div>
                    <div class="digito-box"></div>
                    <div class="digito-box"></div>
                </div>
                <div class="candidato-info" id="info-candidato"></div>
            </div>
            <div class="instrucoes" id="instrucoes-rodape">
                Aperte a tecla:<br>
                <strong>CONFIRMA</strong> para CONFIRMAR este voto<br>
                <strong>CORRIGE</strong> para REINICIAR este voto
            </div>
        </div>

        <!-- TECLADO -->
        <div class="teclado">
            <div class="teclado-linha">
                <button class="btn-num" onclick="digitar('1')">1</button>
                <button class="btn-num" onclick="digitar('2')">2</button>
                <button class="btn-num" onclick="digitar('3')">3</button>
            </div>
            <div class="teclado-linha">
                <button class="btn-num" onclick="digitar('4')">4</button>
                <button class="btn-num" onclick="digitar('5')">5</button>
                <button class="btn-num" onclick="digitar('6')">6</button>
            </div>
            <div class="teclado-linha">
                <button class="btn-num" onclick="digitar('7')">7</button>
                <button class="btn-num" onclick="digitar('8')">8</button>
                <button class="btn-num" onclick="digitar('9')">9</button>
            </div>
            <div class="teclado-linha">
                <button class="btn-num" onclick="digitar('0')">0</button>
            </div>
            <div class="teclado-acoes">
                <button class="btn-acao btn-branco" onclick="votarBranco()">Branco</button>
                <button class="btn-acao btn-corrige" onclick="corrige()">Corrige</button>
                <button class="btn-acao btn-confirma" onclick="confirma()">Confirma</button>
            </div>
        </div>

        <!-- APURAÇÃO / RESULTADOS -->
        <div class="painel-apuração">
            <h3>📊 Parcial da Apuração Geral</h3>
            
            <div id="area-bloqueada" class="bloqueio-container">
                <p style="font-size:0.9rem; color:#64748b;">Digite a senha master para liberar os resultados por ministério:</p>
                <input type="password" id="input-senha" class="senha-input" placeholder="Digite a senha..." onkeydown="checarEnter(event)">
                <button class="btn-desbloquear" onclick="validarSenha()">Liberar Resultado 🔓</button>
                <span id="msg-erro" class="erro-senha">Senha incorreta!</span>
            </div>

            <div id="conteudo-placar" style="display: none;">
                <div id="lista-resultados-cargos">
                    <!-- Gerado via JS -->
                </div>
                <div class="painel-acoes">
                    <button class="btn-ocultar" onclick="ocultarPlacar()">Bloquear Novamente 🔒</button>
                    <button class="btn-zerar" onclick="zerarUrna()">Zerar Urna 🔄</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SENHA_MESTRE = "RESULTADO_VOTACAO";
        
        // Objeto de áudio do som de confirmação
        const somConfirma = new Audio('confirma-urna.mp3');
        somConfirma.volume = 0.8;

        // Mapeamento dos Candidatos e Cargos
        const ministerios = [
            {
                id: 'alegria',
                nome: 'Ministro(a) da Alegria e do Entretenimento',
                candidatos: [
                    { id: '3204', nome: 'Silvia Camila' },
                    { id: '3213', nome: 'Luiz Terra' },
                    { id: '3210', nome: 'Janine Maribondo' }
                ]
            },
            {
                id: 'fofoca',
                nome: 'Ministro(a) do Supremo Tribunal da Fofoca',
                candidatos: [
                    { id: '3208', nome: 'Ana Geórgia' },
                    { id: '3206', nome: 'Luiza Mendes' },
                    { id: '3215', nome: 'Marcely Pimentel' }
                ]
            },
            {
                id: 'comunicacao',
                nome: 'Ministro(a) das Comunicações e Relações Exteriores',
                candidatos: [
                    { id: '3213', nome: 'Luiz Terra' },
                    { id: '3209', nome: 'Izadora Azevedo' },
                    { id: '3211', nome: 'Jederson Pontes' }
                ]
            },
            {
                id: 'saude',
                nome: 'Ministro(a) da Saúde e Sobrevivência',
                candidatos: [
                    { id: '3204', nome: 'Silvia Camila' },
                    { id: '3218', nome: 'Raíssa Cunha' },
                    { id: '3208', nome: 'Geórgia Barbosa' },
                    { id: '3207', nome: 'Denise Belisio' }
                ]
            },
            {
                id: 'nordestina',
                nome: 'Ministro(a) da Cultura Nordestina',
                candidatos: [
                    { id: '3210', nome: 'Janine Maribondo' },
                    { id: '3219', nome: 'Ubaldo Merçon' },
                    { id: '3225', nome: 'Eri Silva' }
                ]
            },
            {
                id: 'minusculas',
                nome: 'Ministro(a) das Minúsculas Causas',
                candidatos: [
                    { id: '3203', nome: 'Artur Avelino' },
                    { id: '3213', nome: 'Luiz Terra' },
                    { id: '3216', nome: 'Pedro de Araújo' },
                    { id: '3214', nome: 'Dannilo Rodrigues' }
                ]
            },
            {
                id: 'juventude',
                nome: 'Ministro(a) da Juventude',
                candidatos: [
                    { id: '3220', nome: 'Ana Clarisse' },
                    { id: '3205', nome: 'Dália Margarida' },
                    { id: '3212', nome: 'Maria Letícia' }
                ]
            },
            {
                id: 'fantasma',
                nome: 'Ministro(a) Fantasma',
                candidatos: [
                    { id: '3201', nome: 'Adriana Rodrigues' },
                    { id: '3221', nome: 'Maria Júlia' },
                    { id: '3225', nome: 'Eri Silva' },
                    { id: '3223', nome: 'Andresa Moura' }
                ]
            },
            {
                id: 'performance',
                nome: 'Ministério da Performance',
                candidatos: [
                    { id: '3216', nome: 'Pedro de Araújo' },
                    { id: '3224', nome: 'Dante Miranda' },
                    { id: '3219', nome: 'Ubaldo Merçon' },
                    { id: '3213', nome: 'Luiz Terra' }
                ]
            }
        ];

        const STORAGE_KEY = 'urna_resenha_ministerios_v1';
        let etapaAtual = 0;
        let numeroDigitado = '';
        let eBranco = false;
        let votando = false; // Controla se a sessão de votação está ativa
        let votosSessaoAtual = {}; // Armazena temporariamente os votos do usuário atual

        function carregarVotos() {
            let salvos = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (!salvos) {
                salvos = {};
                ministerios.forEach(m => {
                    salvos[m.id] = { 'BRANCO': 0, 'NULO': 0 };
                    m.candidatos.forEach(c => salvos[m.id][c.id] = 0);
                });
            }
            return salvos;
        }

        let votos = carregarVotos();

        function iniciarVotacao() {
            votando = true;
            etapaAtual = 0;
            votosSessaoAtual = {};
            numeroDigitado = '';
            eBranco = false;
            atualizarTela();
        }

        function atualizarTela() {
            const conteudoTela = document.getElementById('tela-conteudo');
            const instrucoesRodape = document.getElementById('instrucoes-rodape');

            if (!votando) {
                conteudoTela.innerHTML = `
                    <div class="tela-inicio-fim">
                        <h2>Urna Eletrônica</h2>
                        <p>Pronto para iniciar uma nova sessão de votos?</p>
                        <button class="btn-iniciar" onclick="iniciarVotacao()">Iniciar Votação</button>
                    </div>
                `;
                instrucoesRodape.style.display = 'none';
                return;
            }

            instrucoesRodape.style.display = 'block';
            const minAtual = ministerios[etapaAtual];
            
            conteudoTela.innerHTML = `
                <div class="tela-header" id="etapa-indicador">SEU VOTO VAI PARA (${etapaAtual + 1}/${ministerios.length})</div>
                <div class="cargo-titulo" id="cargo-nome">${minAtual.nome}</div>
                <div class="digitos-container" id="digitos"></div>
                <div class="candidato-info" id="info-candidato"></div>
            `;

            const digitosDiv = document.getElementById('digitos');
            const infoDiv = document.getElementById('info-candidato');

            if (eBranco) {
                infoDiv.innerHTML = '<h3 style="font-size:1.3rem; text-align:center; margin-top:15px; color:#0284c7;">VOTO EM BRANCO</h3>';
                return;
            }

            for (let i = 0; i < 4; i++) {
                const box = document.createElement('div');
                box.className = 'digito-box';
                if (numeroDigitado[i]) {
                    box.innerText = numeroDigitado[i];
                } else if (i === numeroDigitado.length) {
                    box.classList.add('pisca');
                }
                digitosDiv.appendChild(box);
            }

            if (numeroDigitado.length === 4) {
                const candidato = minAtual.candidatos.find(c => c.id === numeroDigitado);
                if (candidato) {
                    infoDiv.innerHTML = `<p><strong>Nome:</strong> ${candidato.nome}</p><p><strong>Número:</strong> ${candidato.id}</p>`;
                } else {
                    infoDiv.innerHTML = `<p style="color:red; font-weight:bold;">VOTO NULO</p><p style="font-size:0.8rem; color:#64748b;">Candidato não concorrente a este ministério</p>`;
                }
            }
        }

        function digitar(n) {
            if (!votando || eBranco || numeroDigitado.length >= 4) return;
            numeroDigitado += n;
            atualizarTela();
        }

        function votarBranco() {
            if (!votando || numeroDigitado !== '') return;
            eBranco = true;
            atualizarTela();
        }

        function corrige() {
            if (!votando) return;
            numeroDigitado = '';
            eBranco = false;
            atualizarTela();
        }

        function confirma() {
            if (!votando) return;
            const minAtual = ministerios[etapaAtual];

            if (eBranco) {
                votosSessaoAtual[minAtual.id] = { tipo: 'BRANCO', valor: 'BRANCO', nome: 'Voto em Branco' };
                proximaEtapa();
            } else if (numeroDigitado.length === 4) {
                const candidato = minAtual.candidatos.find(c => c.id === numeroDigitado);
                if (candidato) {
                    votosSessaoAtual[minAtual.id] = { tipo: 'CANDIDATO', valor: candidato.id, nome: `${candidato.nome} (${candidato.id})` };
                } else {
                    votosSessaoAtual[minAtual.id] = { tipo: 'NULO', valor: 'NULO', nome: `Nulo (${numeroDigitado})` };
                }
                proximaEtapa();
            }
        }

        function proximaEtapa() {
            numeroDigitado = '';
            eBranco = false;

            if (etapaAtual + 1 < ministerios.length) {
                etapaAtual++;
                atualizarTela();
            } else {
                // Tela de REVISÃO DOS VOTOS antes de salvar definitivamente
                mostrarTelaRevisao();
            }
        }

        function mostrarTelaRevisao() {
            const conteudoTela = document.getElementById('tela-conteudo');
            document.getElementById('instrucoes-rodape').style.display = 'none';

            let htmlResumo = `<div style="text-align: center;">
                <h3 style="margin-bottom: 8px; color: #0f172a;">Confira seus Escolhidos</h3>
                <div class="resumo-container">`;

            ministerios.forEach(m => {
                const escolha = votosSessaoAtual[m.id];
                htmlResumo += `<div class="resumo-item"><strong>${m.nome}:</strong> ${escolha ? escolha.nome : 'Não votado'}</div>`;
            });

            htmlResumo += `</div>
                <p style="font-size: 0.8rem; margin: 10px 0; color: #475569;">Pressione <strong>CONFIRMA</strong> para gravar seus votos ou <strong>CORRIGE</strong> para reiniciar.</p>
            </div>`;

            conteudoTela.innerHTML = htmlResumo;

            // Altera o comportamento temporário dos botões da tela de revisão
            // Se apertar confirma aqui, salva de fato e toca o som!
            window.salvarVotosDefinitivos = function() {
                // Efetiva os votos na base geral
                ministerios.forEach(m => {
                    const escolha = votosSessaoAtual[m.id];
                    if (escolha) {
                        if (escolha.tipo === 'BRANCO') {
                            votos[m.id]['BRANCO'] = (votos[m.id]['BRANCO'] || 0) + 1;
                        } else if (escolha.tipo === 'NULO') {
                            votos[m.id]['NULO'] = (votos[m.id]['NULO'] || 0) + 1;
                        } else {
                            votos[m.id][escolha.valor] = (votos[m.id][escolha.valor] || 0) + 1;
                        }
                    }
                });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(votos));

                // Toca o áudio de confirmação da urna
                somConfirma.currentTime = 0;
                somConfirma.play().catch(e => console.log("Áudio bloqueado:", e));

                // Mostra a tela de FIM tradicional
                conteudoTela.innerHTML = `<div class="tela-inicio-fim"><h1 style="font-size: 3.5rem;">FIM</h1></div>`;
                
                setTimeout(() => {
                    votando = false;
                    renderizarPlacar();
                    atualizarTela();
                }, 2500);
            };
        }

        // Sobrescreve a ação do botão confirma apenas na tela de revisão
        const _confirmaOriginal = confirma;
        window.confirma = function() {
            const minAtual = ministerios[etapaAtual];
            if (votando && etapaAtual === ministerios.length - 1 && document.querySelector('.resumo-container')) {
                salvarVotosDefinitivos();
            } else {
                _confirmaOriginal();
            }
        };

        /* --- LÓGICA DE SENHA E EXIBIÇÃO DA APURAÇÃO --- */
        function validarSenha() {
            const senhaDigitada = document.getElementById('input-senha').value;
            const erroMsg = document.getElementById('msg-erro');
            
            if (senhaDigitada === SENHA_MESTRE) {
                document.getElementById('area-bloqueada').style.display = 'none';
                document.getElementById('conteudo-placar').style.display = 'block';
                document.getElementById('input-senha').value = '';
                erroMsg.style.display = 'none';
                renderizarPlacar();
            } else {
                erroMsg.style.display = 'block';
            }
        }

        function checarEnter(event) {
            if (event.key === 'Enter') validarSenha();
        }

        function ocultarPlacar() {
            document.getElementById('area-bloqueada').style.display = 'flex';
            document.getElementById('conteudo-placar').style.display = 'none';
        }

        function renderizarPlacar() {
            const container = document.getElementById('lista-resultados-cargos');
            container.innerHTML = '';

            ministerios.forEach(m => {
                const bloco = document.createElement('div');
                bloco.className = 'cargo-bloco-resultado';
                
                let html = `<h4>${m.nome}</h4>`;
                html += `<table class="tabela-resultados">
                            <thead><tr><th>Nº</th><th>Candidato</th><th>Votos</th></tr></thead>
                            <tbody>`;

                let placarCargo = m.candidatos.map(c => ({
                    id: c.id,
                    nome: c.nome,
                    qtd: (votos[m.id] && votos[m.id][c.id]) ? votos[m.id][c.id] : 0
                })).sort((a, b) => b.qtd - a.qtd);

                placarCargo.forEach(item => {
                    html += `<tr><td><strong>${item.id}</strong></td><td>${item.nome}</td><td><strong>${item.qtd}</strong></td></tr>`;
                });

                const brancos = (votos[m.id] && votos[m.id]['BRANCO']) || 0;
                const nulos = (votos[m.id] && votos[m.id]['NULO']) || 0;

                html += `<tr style="background:#f8fafc"><td>-</td><td>Votos em Branco</td><td>${brancos}</td></tr>`;
                html += `<tr style="background:#f8fafc"><td>-</td><td>Votos Nulos</td><td>${nulos}</td></tr>`;
                html += `</tbody></table>`;

                bloco.innerHTML = html;
                container.appendChild(bloco);
            });
        }

        function zerarUrna() {
            if(confirm("Deseja mesmo zerar TODOS os votos de todos os ministérios?")) {
                localStorage.removeItem(STORAGE_KEY);
                votos = carregarVotos();
                renderizarPlacar();
                corrige();
            }
        }

        // Inicialização
        atualizarTela();
    </script>
</body>
</html>
